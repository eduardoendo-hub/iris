name: Telegram daily summary

# Chama /api/cron/telegram-daily-summary todo dia as 8:03 BRT (= 11:03 UTC).
# O endpoint le o ultimo DailyInsight ja gerado pelo cron Coolify das 5h BRT
# e envia o resumo pro Telegram configurado nas env vars do IRIS.

on:
  schedule:
    - cron: '3 11 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call telegram-daily-summary endpoint
        env:
          IRIS_URL: ${{ secrets.IRIS_URL }}
          CRON_SECRET: ${{ secrets.IRIS_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${IRIS_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "faltam secrets IRIS_URL / IRIS_CRON_SECRET"
            exit 1
          fi
          http_code=$(curl -sS -o /tmp/out -w "%{http_code}" \
            -X POST "${IRIS_URL%/}/api/cron/telegram-daily-summary" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Accept: application/json")
          echo "HTTP $http_code"
          head -c 800 /tmp/out
          echo
          [[ "$http_code" =~ ^2 ]] || exit 1
